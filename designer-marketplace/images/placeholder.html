<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f4f6;
            font-family: 'Arial', sans-serif;
        }
        
        .placeholder {
            width: 300px;
            height: 300px;
            background-color: #e5e7eb;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #6b7280;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .text {
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="icon">📷</div>
        <div class="text">Product Image</div>
    </div>
</body>
</html>
