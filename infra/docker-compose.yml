version: '3.8'

services:
  # Database service
  mongodb:
    image: mongo:6.0
    container_name: autofinder-mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - autofinder-network

  # Backend API service
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: autofinder-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_VERSION=v1
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/autofinder?authSource=admin
      - JWT_SECRET=dev_secret_key
      - JWT_EXPIRY=1d
      - JWT_REFRESH_EXPIRY=30d
      - CORS_ORIGINS=http://localhost:8080,http://localhost:8081
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - PROXY_SERVICE_ENABLED=false
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - autofinder-network

  # Scraper service
  scraper:
    build:
      context: ../scraper
      dockerfile: Dockerfile
    container_name: autofinder-scraper
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - API_URL=http://api:3000/api/v1
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/autofinder?authSource=admin
      - FB_EMAIL=${FB_EMAIL}
      - FB_PASSWORD=${FB_PASSWORD}
      - PROXY_SERVICE_ENABLED=false
    volumes:
      - ../scraper:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - autofinder-network

  # Frontend dashboard
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: autofinder-frontend
    restart: always
    ports:
      - "8080:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api/v1
      - REACT_APP_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - autofinder-network

  # Landing page
  landing:
    build:
      context: ../landing-page
      dockerfile: Dockerfile.dev
    container_name: autofinder-landing
    restart: always
    ports:
      - "8081:3000"
    volumes:
      - ../landing-page:/app
      - /app/node_modules
    networks:
      - autofinder-network

networks:
  autofinder-network:
    driver: bridge

volumes:
  mongodb_data: